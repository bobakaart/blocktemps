<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rise Custom Block Library</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --gallery-bg:#f4f6f4;
    --panel-bg:#ffffff;
    --border:#e3e5e1;
    --border-strong:#d1d6cf;
    --ink:#16241c;
    --muted:#69756e;
    --muted-2:#8b948a;
    --green:#37775a;
    --green-dark:#2a5c46;
    --green-light:#e8f2ec;
    --radius:16px;
    --radius-sm:10px;
    --radius-pill:999px;
    --ease:cubic-bezier(.4,0,.2,1);
    --shadow:0 1px 2px rgba(20,30,25,.04), 0 6px 18px rgba(20,30,25,.06);
    --shadow-hover:0 4px 10px rgba(20,30,25,.07), 0 18px 32px rgba(20,30,25,.10);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--gallery-bg); color:var(--ink);
    font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;
    font-size:16px;
  }
  :focus-visible{outline:2px solid var(--green); outline-offset:2px;}

  header{
    position:sticky; top:0; z-index:40; background:var(--panel-bg);
    border-bottom:1px solid var(--border); padding:16px 24px;
  }
  .header-row{display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:14px;}
  .brand-mark{
    width:38px; height:38px; border-radius:11px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(155deg, var(--green) 0%, var(--green-dark) 100%);
    box-shadow:0 2px 6px rgba(42,92,70,.35);
  }
  .brand h1{font-size:19px; font-weight:800; margin:0; letter-spacing:-.01em;}
  .brand-tagline{font-size:13px; color:var(--muted); display:block; margin-top:2px;}
  .toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .device-toggle{display:flex; background:var(--gallery-bg); border:1px solid var(--border); border-radius:12px; padding:4px; gap:4px;}
  .device-toggle button{
    border:0; background:transparent; padding:10px 16px; font-size:13px; font-weight:700;
    border-radius:9px; cursor:pointer; color:var(--muted); font-family:inherit; min-height:44px;
    transition:background .15s var(--ease), color .15s var(--ease);
  }
  .device-toggle button.active{background:var(--green); color:#fff; box-shadow:0 2px 6px rgba(42,92,70,.25);}
  .theme-btn{
    border:1px solid var(--border); background:#fff; padding:10px 18px; border-radius:12px;
    font-size:13px; font-weight:700; cursor:pointer; color:var(--ink); font-family:inherit; min-height:44px;
    display:inline-flex; align-items:center; gap:8px;
    transition:border-color .15s var(--ease), color .15s var(--ease);
  }
  .theme-btn:hover{border-color:var(--green); color:var(--green);}

  #theme-panel{
    display:none; background:var(--panel-bg); border-bottom:1px solid var(--border);
    padding:24px;
  }
  #theme-panel.open{display:block;}
  .theme-section{max-width:1100px; margin-bottom:22px;}
  .theme-section:last-child{margin-bottom:0;}
  .theme-section-title{font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--muted-2); margin:0 0 12px;}
  .theme-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:16px;}
  .theme-field label{display:block; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin-bottom:6px;}
  .theme-field input{width:100%; border:1px solid var(--border); border-radius:9px; padding:11px 12px; font-size:14px; font-family:inherit; min-height:44px; transition:border-color .15s var(--ease);}
  .theme-field input:hover{border-color:var(--border-strong);}
  #t-custom-a, #t-custom-b{width:100%;}
  .theme-field input[type=color]{padding:3px; height:44px; cursor:pointer;}
  .theme-actions{margin-top:18px; display:flex; gap:10px; flex-wrap:wrap;}
  .theme-actions button{border:1px solid var(--border); background:#fff; padding:11px 18px; border-radius:10px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; min-height:44px; transition:border-color .15s var(--ease), background .15s var(--ease);}
  .theme-actions button:hover{border-color:var(--border-strong);}
  .theme-actions button.primary{background:var(--green); color:#fff; border-color:var(--green);}
  .theme-actions button.primary:hover{background:var(--green-dark); border-color:var(--green-dark);}
  .icon-picker{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
  .icon-swatch{width:48px; height:48px; padding:0; border-radius:11px; cursor:pointer; overflow:hidden; background:none; border:2px solid var(--border); transition:border-color .15s var(--ease), transform .1s var(--ease);}
  .icon-swatch:hover{border-color:var(--border-strong); transform:translateY(-1px);}
  .icon-swatch.active{border-color:var(--green); box-shadow:0 0 0 2px var(--green-light);}

  .filters{
    display:flex; gap:8px; padding:14px 24px; flex-wrap:wrap; align-items:center;
    border-bottom:1px solid var(--border); background:var(--panel-bg);
  }
  .filters .fgroup{display:flex; gap:8px; flex-wrap:wrap;}
  .chip{
    border:1px solid var(--border); background:#fff; padding:9px 16px; border-radius:var(--radius-pill);
    font-size:13px; font-weight:700; cursor:pointer; color:var(--muted); font-family:inherit; min-height:40px;
    transition:border-color .15s var(--ease), background .15s var(--ease), color .15s var(--ease);
  }
  .chip:hover{border-color:var(--border-strong); color:var(--ink);}
  .chip.active{background:var(--green); border-color:var(--green); color:#fff;}
  .filters .sep{width:1px; align-self:stretch; background:var(--border); margin:0 4px;}
  .img-toggle{
    display:inline-flex; align-items:center; gap:9px; margin-left:auto; border:0; background:none;
    cursor:pointer; font-family:inherit; font-size:13px; font-weight:600; color:var(--muted); padding:8px 4px;
  }
  .img-toggle:hover{color:var(--ink);}
  .img-toggle .switch{
    width:36px; height:21px; border-radius:11px; background:var(--border-strong); position:relative; transition:background .15s var(--ease); flex-shrink:0;
  }
  .img-toggle .switch::after{
    content:''; position:absolute; top:2px; left:2px; width:17px; height:17px; border-radius:50%; background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.25); transition:transform .15s var(--ease);
  }
  .img-toggle.on .switch, .width-toggle.on .switch{background:var(--green);}
  .img-toggle.on .switch::after, .width-toggle.on .switch::after{transform:translateX(15px);}

  main{padding:24px;}
  .count{font-size:13px; color:var(--muted); margin-bottom:16px; font-weight:600;}
  .grid{
    display:flex; flex-direction:column; align-items:center; gap:22px;
  }
  .card{
    width:100%;
    background:var(--panel-bg); border:1px solid var(--border); border-radius:var(--radius);
    overflow:hidden; display:flex; flex-direction:column; box-shadow:var(--shadow);
    transition:box-shadow .2s var(--ease), transform .2s var(--ease), max-width .2s var(--ease);
  }
  .card:hover{box-shadow:var(--shadow-hover); transform:translateY(-2px);}
  .card-head{padding:16px 16px 12px; border-bottom:1px solid var(--border);}
  .card-head-top{display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:10px;}
  .card-title{font-size:15px; font-weight:800; margin:0; letter-spacing:-.01em;}
  .width-toggle{
    display:inline-flex; align-items:center; gap:8px; border:0; background:none; flex-shrink:0;
    cursor:pointer; font-family:inherit; font-size:12px; font-weight:700; color:var(--muted); padding:2px;
  }
  .width-toggle:hover{color:var(--ink);}
  .width-toggle .switch{
    width:32px; height:19px; border-radius:10px; background:var(--border-strong); position:relative; transition:background .15s var(--ease); flex-shrink:0;
  }
  .width-toggle .switch::after{
    content:''; position:absolute; top:2px; left:2px; width:15px; height:15px; border-radius:50%; background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.25); transition:transform .15s var(--ease);
  }
  .card-tags{display:flex; gap:6px; flex-wrap:wrap;}
  .tag{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; background:var(--green-light); color:var(--green-dark); padding:3px 9px; border-radius:10px;}
  .tag.img{background:#e6eef7; color:#2f5e8f;}
  .tag.status-verified{background:#1f7a4d; color:#fff;}
  .tag.status-untested{background:#f0efe8; color:#948d7c; border:1px dashed var(--border-strong);}
  .card-preview{background:#eef0ee;}
  .card-preview iframe{width:100%; height:200px; border:0; display:block; background:#fff; transition:height .2s var(--ease);}
  .card-foot{padding:12px 16px 16px;}
  .copy-btn{
    border:1px solid var(--green); background:#fff; color:var(--green); font-weight:800; font-size:14px;
    padding:13px 16px; border-radius:11px; cursor:pointer; font-family:inherit; width:100%; min-height:48px;
    transition:background .15s var(--ease), color .15s var(--ease);
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
  }
  .copy-btn:hover{background:var(--green); color:#fff;}
  .copy-btn.copied{background:var(--green); color:#fff; border-color:var(--green);}

  .empty-state{width:100%; text-align:center; padding:70px 20px; color:var(--muted);}
  .empty-state strong{display:block; font-size:15px; color:var(--ink); margin-bottom:4px; font-weight:800;}

  footer{padding:28px 20px 60px; font-size:12px; color:var(--muted); text-align:center;}

  @media (max-width:480px){
    .brand h1{font-size:17px;}
    header{padding:14px 16px;}
    .filters{padding:12px 16px;}
    main{padding:16px;}
    .grid{gap:16px;}
  }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div class="brand">
      <span class="brand-mark">
        <svg width="19" height="19" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <path d="M50 20 C75 30 78 60 50 84 C22 60 25 30 50 20 Z" fill="#fff"/>
          <line x1="50" y1="26" x2="50" y2="78" stroke="#2a5c46" stroke-width="3"/>
        </svg>
      </span>
      <div>
        <h1>Rise Custom Block Library</h1>
        <span class="brand-tagline">Copy source, paste into an HTML Embed block in Rise</span>
      </div>
    </div>
    <div class="toolbar">
      <div class="device-toggle">
        <button id="dev-mobile" class="active" onclick="setDevice('mobile')">Mobile 390</button>
        <button id="dev-desktop" onclick="setDevice('desktop')">Desktop 920</button>
      </div>
      <button class="theme-btn" onclick="toggleThemePanel()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
        Theme settings
      </button>
    </div>
  </div>
</header>

<div id="theme-panel">
  <div class="theme-section">
    <p class="theme-section-title">Typography</p>
    <div class="theme-grid">
      <div class="theme-field">
        <label>Font family</label>
        <input type="text" id="t-font" value="'Inter', sans-serif" oninput="onThemeChange()">
      </div>
      <div class="theme-field">
        <label>Heading size</label>
        <input type="text" id="t-h1" value="22px" oninput="onThemeChange()">
      </div>
      <div class="theme-field">
        <label>Tagline size</label>
        <input type="text" id="t-tagline" value="12px" oninput="onThemeChange()">
      </div>
      <div class="theme-field">
        <label>Body size</label>
        <input type="text" id="t-body" value="16px" oninput="onThemeChange()">
      </div>
    </div>
  </div>

  <div class="theme-section">
    <p class="theme-section-title">Colors</p>
    <div class="theme-grid">
      <div class="theme-field">
        <label>Primary color</label>
        <input type="color" id="t-primary" value="#37775a" oninput="onThemeChange()">
      </div>
      <div class="theme-field">
        <label>Primary tint (bg)</label>
        <input type="color" id="t-primary-light" value="#e8f2ec" oninput="onThemeChange()">
      </div>
      <div class="theme-field">
        <label>Text color</label>
        <input type="color" id="t-text" value="#1a2e24" oninput="onThemeChange()">
      </div>
      <div class="theme-field">
        <label>Icon color</label>
        <input type="color" id="t-icon-color" value="#37775a" oninput="onThemeChange()">
      </div>
      <div class="theme-field">
        <label>Icon background</label>
        <input type="color" id="t-icon-bg" value="#e8f2ec" oninput="onThemeChange()">
      </div>
    </div>
  </div>

  <div class="theme-section">
    <p class="theme-section-title">Icons</p>
    <div class="theme-field">
      <label>Primary icon (Icon A &mdash; "before" / single-state slots)</label>
      <div class="icon-picker" id="picker-a"></div>
      <input type="text" id="t-custom-a" placeholder="Paste a custom image URL&hellip;" oninput="onCustomUrlChange('A')" style="display:none;margin-top:10px;">
    </div>
    <div class="theme-field" style="margin-top:16px;">
      <label>Secondary icon (Icon B &mdash; "after" / alternate-state slots)</label>
      <div class="icon-picker" id="picker-b"></div>
      <input type="text" id="t-custom-b" placeholder="Paste a custom image URL&hellip;" oninput="onCustomUrlChange('B')" style="display:none;margin-top:10px;">
    </div>
  </div>

  <div class="theme-actions">
    <button class="primary" onclick="downloadThemeJson()">Download theme.json</button>
    <button onclick="resetTheme()">Reset to defaults</button>
  </div>
</div>

<div class="filters">
  <div class="fgroup" id="cat-filters"></div>
  <div class="sep"></div>
  <button class="img-toggle" id="img-filter" onclick="toggleImgFilter()">
    <span class="switch"></span>
    Hide icon-illustrated blocks
  </button>
</div>

<main>
  <div class="count" id="result-count"></div>
  <div class="grid" id="grid"></div>
</main>

<footer>Rise Custom Block Library &middot; personal reference tool</footer>

<!-- ============================================================
     BLOCK SOURCE TEMPLATES
     Each <template> holds a fully self-contained block: inline
     CSS + JS, no external deps. Every block starts its script with
     a TEXT object holding every user-facing string in one place,
     so translation never requires touching markup or logic.
     Tokens like __COLOR_PRIMARY__ get swapped for live theme
     values before preview/copy. __ICON_A__ / __ICON_B__ get
     swapped for the selected flat-icon SVG.
     ============================================================ -->

<template id="src-slider-compare">
<div class="cmp-wrap" style="font-family:__FONT_FAMILY__;max-width:__MAX_WIDTH__;margin:0 auto;">
<style>
  .cmp-slider{position:relative;width:100%;height:280px;overflow:hidden;border-radius:16px;cursor:ew-resize;user-select:none;box-shadow:0 4px 16px rgba(0,0,0,.12);touch-action:none;}
  .cmp-after,.cmp-before-wrap{position:absolute;inset:0;}
  .cmp-before-wrap{width:50%;overflow:hidden;}
  .cmp-before-inner{position:absolute;top:0;left:0;width:480px;height:280px;}
  .cmp-handle{position:absolute;top:0;left:50%;width:4px;height:100%;background:#fff;transform:translateX(-50%);box-shadow:0 0 8px rgba(0,0,0,.3);}
  .cmp-grab{position:absolute;top:50%;left:50%;width:48px;height:48px;transform:translate(-50%,-50%);border-radius:50%;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;}
  .cmp-badge{position:absolute;bottom:14px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:700;padding:6px 12px;border-radius:20px;}
  .cmp-badge.before{left:14px;} .cmp-badge.after{right:14px;}
</style>
<div class="cmp-slider">
  <div class="cmp-after">__ICON_B__</div>
  <div class="cmp-before-wrap"><div class="cmp-before-inner">__ICON_A__</div></div>
  <div class="cmp-handle">
    <div class="cmp-grab">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="__COLOR_PRIMARY__" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9,5 4,12 9,19"/><polyline points="15,5 20,12 15,19"/></svg>
    </div>
  </div>
  <span class="cmp-badge before" data-t="labelBefore"></span>
  <span class="cmp-badge after" data-t="labelAfter"></span>
</div>
</div>
<script>
var TEXT = { labelBefore:"Before", labelAfter:"After" };
(function(){
  var root=document.currentScript.previousElementSibling;
  root.querySelector('[data-t=labelBefore]').textContent = TEXT.labelBefore;
  root.querySelector('[data-t=labelAfter]').textContent = TEXT.labelAfter;
  var el=root.querySelector('.cmp-slider');
  var wrap=root.querySelector('.cmp-before-wrap');
  var handle=root.querySelector('.cmp-handle');
  var dragging=false;
  function setPos(clientX){
    var r=el.getBoundingClientRect();
    var pct=Math.min(Math.max((clientX-r.left)/r.width,0.02),0.98);
    wrap.style.width=(pct*100)+"%";
    handle.style.left=(pct*100)+"%";
  }
  el.addEventListener('pointerdown',function(e){dragging=true;setPos(e.clientX);});
  window.addEventListener('pointermove',function(e){if(dragging)setPos(e.clientX);});
  window.addEventListener('pointerup',function(){dragging=false;});
})();
</script>
</template>

<template id="src-tap-toggle">
<div class="tt-wrap" style="font-family:__FONT_FAMILY__;max-width:__MAX_WIDTH__;margin:0 auto;">
<style>
  .tt-stage{position:relative;height:240px;border-radius:16px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.12);}
  .tt-icon-a,.tt-icon-b{position:absolute;inset:0;}
  .tt-label{position:absolute;bottom:14px;left:14px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:700;padding:6px 12px;border-radius:20px;}
  .tt-btn{margin-top:14px;width:100%;min-height:52px;border:2px solid __COLOR_PRIMARY__;background:#fff;color:__COLOR_PRIMARY__;font-weight:800;font-size:15px;border-radius:12px;cursor:pointer;font-family:inherit;}
  .tt-btn:active{background:__COLOR_PRIMARY_LIGHT__;}
</style>
<div class="tt-stage">
  <div class="tt-icon-a">__ICON_A__</div>
  <div class="tt-icon-b" style="display:none;">__ICON_B__</div>
  <span class="tt-label" data-t="stateA"></span>
</div>
<button class="tt-btn" data-t="button"></button>
</div>
<script>
var TEXT = { stateA:"State A", stateB:"State B", button:"Tap to compare" };
(function(){
  var root=document.currentScript.previousElementSibling;
  var a=root.querySelector('.tt-icon-a'), b=root.querySelector('.tt-icon-b');
  var label=root.querySelector('.tt-label');
  var btn=root.querySelector('.tt-btn');
  btn.textContent = TEXT.button;
  label.textContent = TEXT.stateA;
  var showingA=true;
  btn.addEventListener('click',function(){
    showingA=!showingA;
    a.style.display = showingA ? 'block' : 'none';
    b.style.display = showingA ? 'none' : 'block';
    label.textContent = showingA ? TEXT.stateA : TEXT.stateB;
  });
})();
</script>
</template>

<template id="src-overlay-fade">
<div class="of-wrap" style="font-family:__FONT_FAMILY__;max-width:__MAX_WIDTH__;margin:0 auto;">
<style>
  .of-stage{position:relative;height:240px;border-radius:16px;overflow:hidden;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.12);user-select:none;-webkit-user-select:none;touch-action:none;}
  .of-a,.of-top{position:absolute;inset:0;}
  .of-top{transition:opacity .25s ease;}
  .of-hint{position:absolute;bottom:14px;left:14px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:700;padding:6px 12px;border-radius:20px;pointer-events:none;}
</style>
<div class="of-stage">
  <div class="of-a">__ICON_A__</div>
  <div class="of-top">__ICON_B__</div>
  <span class="of-hint" data-t="hint"></span>
</div>
</div>
<script>
var TEXT = { hint:"Press & hold to compare" };
(function(){
  var root=document.currentScript.previousElementSibling;
  root.querySelector('.of-hint').textContent = TEXT.hint;
  var stage=root.querySelector('.of-stage');
  var top=root.querySelector('.of-top');
  function reveal(){ top.style.opacity='0'; }
  function cover(){ top.style.opacity='1'; }
  stage.addEventListener('pointerdown', reveal);
  stage.addEventListener('pointerup', cover);
  stage.addEventListener('pointerleave', cover);
  stage.addEventListener('pointercancel', cover);
})();
</script>
</template>

<template id="src-hotspot-id">
<div class="hs-wrap" style="font-family:__FONT_FAMILY__;max-width:__MAX_WIDTH__;margin:0 auto;">
<style>
  .hs-stage{position:relative;height:260px;border-radius:16px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.12);}
  .hs-dot{position:absolute;width:38px;height:38px;border-radius:50%;background:__COLOR_PRIMARY__;border:4px solid #fff;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3);transform:translate(-50%,-50%);}
  .hs-dot::after{content:'';position:absolute;inset:-8px;border-radius:50%;border:2px solid __COLOR_PRIMARY__;opacity:.5;animation:hs-pulse 1.8s ease-out infinite;}
  @keyframes hs-pulse{0%{transform:scale(.8);opacity:.6;}100%{transform:scale(1.6);opacity:0;}}
  .hs-callout{margin-top:14px;padding:14px 16px;background:__COLOR_PRIMARY_LIGHT__;border-radius:12px;font-size:__BODY_SIZE__;color:__COLOR_TEXT__;min-height:24px;line-height:1.5;}

  <div class="sb-bin bad"><div class="sb-bin-head" data-t="binBad"></div></div>
</div>
<button class="sb-reset" data-t="reset"></button>
</div>
<script>
var TEXT = {
  instruction: "Tap an item, then tap the correct bin.",
  scoreTemplate: "{n} / {total} sorted",
  binGood: "Correct technique",
  binBad: "Incorrect technique",
  reset: "Reset",
  items: [
    {label:"Clean 45\u00b0 cut", correct:"good"},
    {label:"Flush cut", correct:"bad"},
    {label:"Cut outside collar", correct:"good"},
    {label:"Stub left behind", correct:"bad"}
  ]
};
(function(){
  var root=document.currentScript.previousElementSibling;
  root.querySelector('[data-t=instruction]').textContent = TEXT.instruction;
  root.querySelector('[data-t=binGood]').textContent = TEXT.binGood;
  root.querySelector('[data-t=binBad]').textContent = TEXT.binBad;
  var resetBtn = root.querySelector('.sb-reset');
  resetBtn.textContent = TEXT.reset;
  var itemsWrap = root.querySelector('.sb-items');
  var scoreEl = root.querySelector('.sb-score');
  var binGood = root.querySelector('.sb-bin.good');
  var binBad = root.querySelector('.sb-bin.bad');
  var selected=null, sortedCount=0;

  function updateScore(){
    scoreEl.textContent = TEXT.scoreTemplate.replace('{n}', sortedCount).replace('{total}', TEXT.items.length);
    resetBtn.style.display = sortedCount===TEXT.items.length ? 'block' : 'none';
  }

  function build(){
    itemsWrap.innerHTML='';
    sortedCount=0;
    TEXT.items.forEach(function(it, idx){
      var chip=document.createElement('button');
      chip.className='sb-item';
      chip.textContent=it.label;
      chip.dataset.correct=it.correct;
      chip.dataset.idx=idx;
      chip.addEventListener('click',function(){
        root.querySelectorAll('.sb-item').forEach(function(x){x.classList.remove('selected');});
        selected=chip; chip.classList.add('selected');
      });
      itemsWrap.appendChild(chip);
    });
    updateScore();
  }

  [binGood, binBad].forEach(function(bin){
    bin.addEventListener('click',function(){
      if(!selected) return;
      var binType = bin.classList.contains('good') ? 'good' : 'bad';
      var ok = selected.dataset.correct === binType;
      selected.classList.remove('selected');
      selected.classList.add(ok ? 'correct' : 'wrong');
      var icon=document.createElement('span');
      icon.className='sb-icon ' + (ok ? 'ok' : 'no');
      icon.textContent = ok ? '\u2713' : '\u2715';
      selected.appendChild(icon);
      selected.style.pointerEvents='none';
      sortedCount++;
      bin.appendChild(selected);
      selected=null;
      updateScore();
    });
  });

  resetBtn.addEventListener('click', build);
  build();
})();
</script>
</template>

  <p class="mp-instruction" data-t="instruction"></p>
  <span class="mp-score"></span>
</div>

  <div class="mp-col mp-col-left"></div>
  <div class="mp-col mp-col-right"></div>
</div>
<button class="mp-reset" data-t="reset"></button>
</div>
<script>
var TEXT = {
  instruction: "Tap a role, then tap its matching description.",
  scoreTemplate: "{n} / {total} matched",
  reset: "Reset",
  pairs: [
    {left:"Sales Arborist", right:"Scopes and sells the work"},
    {left:"Crew Leader", right:"Performs the tree care in the field"},
    {left:"Consulting Arborist", right:"Provides expert assessments and reports"},
    {left:"Office Coordinator", right:"Handles office scheduling and billing"}
  ]
};
(function(){
  var root=document.currentScript.previousElementSibling;
  root.querySelector('.mp-instruction').textContent = TEXT.instruction;
  var resetBtn=root.querySelector('.mp-reset');
  resetBtn.textContent = TEXT.reset;
  var colLeft=root.querySelector('.mp-col-left');
  var colRight=root.querySelector('.mp-col-right');
  var scoreEl=root.querySelector('.mp-score');
  var selectedLeft=null, matchedCount=0;

  function shuffle(arr){
    var a=arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }

  function updateScore(){
    scoreEl.textContent = TEXT.scoreTemplate.replace('{n}', matchedCount).replace('{total}', TEXT.pairs.length);
    resetBtn.style.display = matchedCount===TEXT.pairs.length ? 'block' : 'none';
  }

  function build(){
    colLeft.innerHTML=''; colRight.innerHTML='';
    selectedLeft=null; matchedCount=0;
    var rightShuffled = shuffle(TEXT.pairs);

    TEXT.pairs.forEach(function(p){
      var b=document.createElement('button');
      b.className='mp-item'; b.textContent=p.left; b.dataset.left=p.left;
      b.addEventListener('click',function(){
        if(b.classList.contains('matched')) return;
        colLeft.querySelectorAll('.mp-item').forEach(function(x){x.classList.remove('selected');});
        selectedLeft=b; b.classList.add('selected');
      });
      colLeft.appendChild(b);
    });

    rightShuffled.forEach(function(p){
      var b=document.createElement('button');
      b.className='mp-item'; b.textContent=p.right; b.dataset.left=p.left;
      b.addEventListener('click',function(){
        if(!selectedLeft || b.classList.contains('matched')) return;
        var ok = selectedLeft.dataset.left === b.dataset.left;
        if(ok){
          selectedLeft.classList.remove('selected');
          selectedLeft.classList.add('matched');
          b.classList.add('matched');
          matchedCount++;
          updateScore();
          selectedLeft=null;
        }else{
          b.classList.add('shake');
          selectedLeft.classList.add('shake');
          setTimeout(function(){
            b.classList.remove('shake');
            selectedLeft.classList.remove('shake','selected');
            selectedLeft=null;
          },300);
        }
      });
      colRight.appendChild(b);
    });
    updateScore();
  }

  resetBtn.addEventListener('click', build);
  build();
})();
</script>
</template>

function getIconSvg(iconId){
  const icon = ICONS.find(i=>i.id===iconId) || ICONS[0];
  return icon.render(THEME.iconColor, THEME.iconBg);
}

function getSlotMarkup(slot){
  const iconId = slot==='A' ? THEME.iconA : THEME.iconB;
  if(iconId === 'custom'){
    const url = slot==='A' ? THEME.customImageAUrl : THEME.customImageBUrl;
    if(url){
      return '<img src="'+url+'" alt="" style="width:100%;height:100%;object-fit:cover;display:block;">';
    }
    return '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:'+THEME.iconBg+';color:'+THEME.iconColor+';font-size:12px;font-weight:700;text-align:center;padding:14px;line-height:1.4;">Add an image URL in Theme settings</div>';
  }
  return getIconSvg(iconId);
}

let activeCat = 'all';
let hideImg = false;
let fullWidth = {};

function substitute(raw, block){
  const maxWidth = fullWidth[block.id] ? 'none' : (block.maxWidth + 'px');
  return raw
    .replaceAll('__ICON_A__', getSlotMarkup('A'))
    .replaceAll('__ICON_B__', getSlotMarkup('B'))
    .replaceAll('__FONT_FAMILY__', THEME.fontFamily)
    .replaceAll('__COLOR_PRIMARY_LIGHT__', THEME.colorPrimaryLight)
    .replaceAll('__COLOR_PRIMARY__', THEME.colorPrimary)
    .replaceAll('__COLOR_TEXT__', THEME.colorText)
    .replaceAll('__H1_SIZE__', THEME.h1Size)
    .replaceAll('__TAGLINE_SIZE__', THEME.taglineSize)
    .replaceAll('__BODY_SIZE__', THEME.bodySize)
    .replaceAll('__MAX_WIDTH__', maxWidth);
}

function getSource(blockId){
  const tpl = document.getElementById('src-'+blockId);
  const div = document.createElement('div');
  div.appendChild(tpl.content.cloneNode(true));
  return div.innerHTML.trim();
}

function buildIframeDoc(html){
  return '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;padding:18px;background:#fff;}</style></head><body>'+html+'</body></html>';
}

function renderCatFilters(){
  const wrap = document.getElementById('cat-filters');
  wrap.innerHTML = '';
  CATEGORIES.forEach(c=>{
    const b = document.createElement('button');
    b.className = 'chip' + (c.id===activeCat ? ' active' : '');
    b.textContent = c.label;
    b.onclick = ()=>{ activeCat = c.id; renderCatFilters(); renderGrid(); };
    wrap.appendChild(b);
  });
}

function toggleImgFilter(){
  hideImg = !hideImg;
  document.getElementById('img-filter').classList.toggle('on', hideImg);
  renderGrid();
}

const MIN_PREVIEW_H = 140;

function attachAutoHeight(iframe){
  function resize(){
    let doc;
    try{ doc = iframe.contentDocument; }catch(e){ return; }
    if(!doc || !doc.body) return;
    const h = doc.documentElement.scrollHeight;
    iframe.style.height = Math.max(h, MIN_PREVIEW_H) + 'px';
  }
  iframe._resize = resize;
  iframe.addEventListener('load', ()=>{
    resize();
    try{
      const ro = new ResizeObserver(resize);
      ro.observe(iframe.contentDocument.body);
    }catch(e){}
  });
}

const DEVICE_WIDTHS = { mobile: 390, desktop: 920 };
let deviceMode = 'mobile';

function buildCard(b){
  const raw = getSource(b.id);
  const rendered = substitute(raw, b);
  const isFull = !!fullWidth[b.id];
  const deviceW = DEVICE_WIDTHS[deviceMode];
  const targetW = isFull ? deviceW : Math.min(b.maxWidth, deviceW);

  const card = document.createElement('div');
  card.className = 'card' + (isFull ? ' is-full-width' : '');
  card.style.maxWidth = targetW + 'px';

  const catLabel = CATEGORIES.find(c=>c.id===b.cat).label;
  card.innerHTML = `
    <div class="card-head">
      <div class="card-head-top">
        <p class="card-title">${b.name}</p>
        <button class="width-toggle${isFull ? ' on' : ''}" title="Preview and copy this block without its own max-width">
          <span class="switch"></span> Full width
        </button>
      </div>
      <div class="card-tags">
        <span class="tag">${catLabel}</span>
        ${b.img ? '<span class="tag img">Icon illustrated</span>' : ''}
        <span class="tag status-${b.verified ? 'verified' : 'untested'}">${b.verified ? '&check; Verified in Rise' : 'Untested'}</span>
      </div>
    </div>
    <div class="card-preview"></div>
    <div class="card-foot">
      <button class="copy-btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="copy-label">Copy code</span>
      </button>
    </div>
  `;

  card.querySelector('.width-toggle').addEventListener('click', ()=>{
    fullWidth[b.id] = !fullWidth[b.id];
    card.replaceWith(buildCard(b));
  });

  const previewWrap = card.querySelector('.card-preview');
  const iframe = document.createElement('iframe');
  attachAutoHeight(iframe);
  previewWrap.appendChild(iframe);
  iframe.srcdoc = buildIframeDoc(rendered);

  const copyBtn = card.querySelector('.copy-btn');
  const copyLabel = copyBtn.querySelector('.copy-label');
  copyBtn.addEventListener('click', ()=>{
    navigator.clipboard.writeText(rendered).then(()=>{
      copyLabel.textContent = 'Copied!';
      copyBtn.classList.add('copied');
      setTimeout(()=>{ copyLabel.textContent='Copy code'; copyBtn.classList.remove('copied'); }, 1500);
    });
  });

  return card;
}

function renderGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const list = BLOCKS.filter(b => (activeCat==='all' || b.cat===activeCat) && (!hideImg || !b.img));
  document.getElementById('result-count').textContent = list.length + ' block' + (list.length===1?'':'s');

  if(list.length === 0){
    grid.innerHTML = '<div class="empty-state"><strong>No blocks match these filters</strong>Try a different category or turn off "Hide icon-illustrated blocks".</div>';
    return;
  }

  list.forEach(b=>{ grid.appendChild(buildCard(b)); });
}

function setDevice(mode){
  deviceMode = mode;
  document.getElementById('dev-mobile').classList.toggle('active', mode==='mobile');
  document.getElementById('dev-desktop').classList.toggle('active', mode==='desktop');
  renderGrid();
}

function toggleThemePanel(){
  document.getElementById('theme-panel').classList.toggle('open');
}

function renderIconPicker(containerId, selectedId, onSelect){
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  ICONS.forEach(icon=>{
    const btn = document.createElement('button');
    btn.className = 'icon-swatch' + (icon.id===selectedId ? ' active' : '');
    btn.title = icon.name;
    btn.innerHTML = icon.render(THEME.iconColor, THEME.iconBg);
    btn.onclick = ()=> onSelect(icon.id);
    el.appendChild(btn);
  });
  const customBtn = document.createElement('button');
  customBtn.className = 'icon-swatch' + (selectedId==='custom' ? ' active' : '');
  customBtn.title = 'Custom image URL';
  customBtn.style.display='flex'; customBtn.style.alignItems='center'; customBtn.style.justifyContent='center';
  customBtn.style.background = THEME.iconBg;
  customBtn.innerHTML = '<svg width="60%" height="60%" viewBox="0 0 24 24" fill="none" stroke="'+THEME.iconColor+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>';
  customBtn.onclick = ()=> onSelect('custom');
  el.appendChild(customBtn);
}

function onCustomUrlChange(slot){
  if(slot==='A') THEME.customImageAUrl = document.getElementById('t-custom-a').value.trim();
  else THEME.customImageBUrl = document.getElementById('t-custom-b').value.trim();
  renderGrid();
}

function renderIconPickers(){
  renderIconPicker('picker-a', THEME.iconA, (id)=>{ THEME.iconA=id; renderIconPickers(); renderGrid(); });
  renderIconPicker('picker-b', THEME.iconB, (id)=>{ THEME.iconB=id; renderIconPickers(); renderGrid(); });
  const inputA = document.getElementById('t-custom-a');
  const inputB = document.getElementById('t-custom-b');
  inputA.style.display = THEME.iconA==='custom' ? 'block' : 'none';
  inputB.style.display = THEME.iconB==='custom' ? 'block' : 'none';
  inputA.value = THEME.customImageAUrl;
  inputB.value = THEME.customImageBUrl;
}

function onThemeChange(){
  THEME.fontFamily = document.getElementById('t-font').value;
  THEME.colorPrimary = document.getElementById('t-primary').value;
  THEME.colorPrimaryLight = document.getElementById('t-primary-light').value;
  THEME.colorText = document.getElementById('t-text').value;
  THEME.h1Size = document.getElementById('t-h1').value;
  THEME.taglineSize = document.getElementById('t-tagline').value;
  THEME.bodySize = document.getElementById('t-body').value;
  THEME.iconColor = document.getElementById('t-icon-color').value;
  THEME.iconBg = document.getElementById('t-icon-bg').value;
  renderIconPickers();
  renderGrid();
}

function resetTheme(){
  document.getElementById('t-font').value = "'Inter', sans-serif";
  document.getElementById('t-primary').value = "#37775a";
  document.getElementById('t-primary-light').value = "#e8f2ec";
  document.getElementById('t-text').value = "#1a2e24";
  document.getElementById('t-h1').value = "22px";
  document.getElementById('t-tagline').value = "12px";
  document.getElementById('t-body').value = "16px";
  document.getElementById('t-icon-color').value = "#37775a";
  document.getElementById('t-icon-bg').value = "#e8f2ec";
  THEME.iconA = 'tree-round';
  THEME.iconB = 'tree-bare';
  THEME.customImageAUrl = '';
  THEME.customImageBUrl = '';
  onThemeChange();
}

function downloadThemeJson(){
  const blob = new Blob([JSON.stringify(THEME, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'theme.json';
  a.click();
}

renderCatFilters();
renderIconPickers();
renderGrid();
</script>
